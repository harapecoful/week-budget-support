<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>のこらをリリースしました</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #FAF7F1;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
      line-height: 1.8;
    }

    .card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 24px;
    }

    .date {
      font-size: 14px;
      color: #AAA;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.4;
      margin: 0 0 24px;
    }

    h2 {
      font-size: 20px;
      margin: 32px 0 12px;
    }

    p {
      font-size: 16px;
      margin: 0 0 20px;
    }

    ul {
      padding-left: 22px;
      margin: 0;
    }

    li {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .message {
      margin-top: 28px;
      padding: 20px;
      border-radius: 16px;
      background: #F2F7F0;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="date">2026年9月10日</div>

    <h1>のこらをリリースしました</h1>

    <p>
      週予算 家計管理アプリ「のこら」をリリースしました。
    </p>

    <p>
      のこらは、月の予算を週ごとに分けて管理し、
      「今週あといくら使えるか」を分かりやすく確認できる家計管理アプリです。
    </p>

    <h2>主な機能</h2>

    <ul>
      <li>今週の残り予算をひと目で確認</li>
      <li>月予算を週ごとに分けて管理</li>
      <li>週ごとの予算を自由に調整</li>
      <li>支出履歴の確認</li>
      <li>月ごと・週ごとの振り返り</li>
    </ul>

    <div class="message">
      これからも、日々の家計管理が少しラクになる機能を追加していきます。
      どうぞよろしくお願いします。
    </div>
  </div>
</body>
</html>
