<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公開日時テスト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #FAF7F1;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
      line-height: 1.8;
    }

    .card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 24px;
    }

    .date {
      font-size: 14px;
      color: #AAA;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.4;
      margin: 0 0 24px;
    }

    p {
      font-size: 16px;
      margin: 0 0 20px;
    }

    .message {
      margin-top: 28px;
      padding: 20px;
      border-radius: 16px;
      background: #F2F7F0;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="date">2026年9月20日</div>

    <h1>公開日時テスト</h1>

    <p>
      このページが表示されれば、お知らせごとのURL遷移は正常です。
    </p>

    <div class="message">
      公開日時指定のお知らせが正常に表示されています。
    </div>
  </div>
</body>
</html>
